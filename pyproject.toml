[project]
name = "thurnatur-marktuebersicht"
version = "0.1.0"
description = "Interactive choropleth dashboard for ThurNaturGau Handel — livestock distribution and feed-purchase potential per Thurgau municipality. ZHAW IUNR PODSV course project."
authors = [
    { name = "Christian Haag" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pandas>=2.2.0",
    "requests>=2.31.0",
    "folium>=0.17.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.8.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
]
